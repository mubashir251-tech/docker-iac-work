
name: Docker IaC CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    name: Test Flask App and Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r web-app/requirements-dev.txt

      - name: Run application tests
        run: |
          PYTHONPATH=web-app pytest -v web-app/tests/

      - name: Build Docker image
        run: |
          docker build -t docker-iac-web:ci ./web-app
